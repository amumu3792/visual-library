name: build-kb

# 触发：源数据（视觉资料库 / Cookbook）或构建工具本身有新提交时，自动重建页面。
# 生成结果由机器人提交回仓库（提交信息带 [skip ci] 且用默认令牌推送，不会循环触发）。
# 也可以在 GitHub 的 Actions 页签里手动点「Run workflow」跑一次。
on:
  push:
    branches: [main]
    paths:
      - '视觉资料库/**'
      - 'AI-Visual-Prompt-Cookbook-main/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-kb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成页面（暂存区并入 + 知识库页 + 总览表 + 三视图首页）
        run: python tools/build.py

      - name: 把生成结果提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "自动构建：更新页面 [skip ci]"
            git push
          fi
